# Frontend CI/CD — Phase 7 (Plan.md §9, Skills D).
# - Mọi push/PR: install + lint + typecheck/build + Vitest (test trước deploy).
# - Chỉ nhánh main: build với VITE_* secrets rồi deploy GitHub Pages.
# - Secrets (GitHub Settings → Secrets and variables → Actions):
#     VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#   (chỉ anon key công khai — key đặc quyền không bao giờ xuất hiện ở đây).
# - Repo Settings → Pages → Source: GitHub Actions.
name: frontend-deploy

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-deploy.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
