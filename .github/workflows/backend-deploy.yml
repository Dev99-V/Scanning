# Backend CI/CD — Phase 7 (Plan.md §9, Skills D).
# - Mọi push/PR: dựng Supabase local, chạy gate P1+P2+P3 (test trước deploy).
# - Chỉ nhánh main: link project cloud + db push migrations + deploy Edge Functions.
# - Secrets (GitHub Settings → Secrets and variables → Actions):
#     SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID
#   Không commit key; Edge Functions đọc SUPABASE_URL/SERVICE_ROLE từ runtime.
name: backend-deploy

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-deploy.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-deploy.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
        working-directory: backend
      - name: QC gate Phase 1 (schema + RLS)
        run: ./supabase/tests/qc_phase1.sh
        working-directory: backend
      - name: QC gate Phase 2 (import-reference)
        run: ./supabase/tests/qc_phase2.sh
        working-directory: backend
      - name: QC gate Phase 3 (scan-submit + race)
        run: ./supabase/tests/qc_phase3.sh
        working-directory: backend
      - name: Stop local stack
        if: always()
        run: supabase stop
        working-directory: backend

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link cloud project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Push migrations
        run: supabase db push
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy Edge Functions
        run: supabase functions deploy import-reference scan-submit resolve-duplicate
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
